<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121728"><title>PIX Collector</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f6fb;background:#101422}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px;background:linear-gradient(135deg,#25215c,#111a2c)}h1{margin:0;font-size:28px}header p{color:#d1d3e7;margin:8px 0 16px}.wrap{max-width:900px;margin:auto;padding:18px}button,select,input{font:inherit;border-radius:11px;padding:12px;border:1px solid #404764}button{background:#7d68f5;color:white;cursor:pointer}button.secondary{background:#252b42}button.owned{background:#248c73}select,input{background:#1b2235;color:white}input{width:100%}.bar,.filters{display:flex;gap:9px;flex-wrap:wrap}.stats{display:flex;gap:12px;margin:12px 0 20px}.stat{flex:1;padding:16px;background:#20263b;border-radius:14px}.stat strong{display:block;font-size:25px}.stat span{font-size:13px;color:#c7c9da}.filters{margin:12px 0 20px}.filters button{padding:9px 14px}.filters .active{background:#b9acff;color:#17132d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}.group{background:#20263b;border:1px solid #394059;border-radius:16px;overflow:hidden}.group summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:14px}.group summary::-webkit-details-marker{display:none}.thumb{height:72px;width:72px;flex-shrink:0;border-radius:10px;background:#30334e;display:grid;place-items:center;color:#c4c7df;font-weight:700}.thumb img{width:100%;height:100%;object-fit:contain}.group-title{flex:1;min-width:0}.group-title strong{display:block;font-size:17px}.muted{color:#c4c7d7;font-size:13px}.arrow{font-size:20px}.group[open] .arrow{transform:rotate(90deg)}.variant{padding:14px;border-top:1px solid #3c435b;display:flex;align-items:center;gap:12px}.variant-info{flex:1;min-width:0}.variant-info strong{display:block}.variant button{font-size:13px;padding:10px;min-width:100px}.empty{color:#c9ccdd;padding:25px;text-align:center;border:1px dashed #525875;border-radius:12px}.hint{color:#b9bed5;font-size:13px;line-height:1.5}footer{text-align:center;color:#949ab5;padding:25px;font-size:12px}@media(max-width:380px){.variant{flex-wrap:wrap}.variant button{width:100%}}
</style></head>
<body><header><div style="max-width:900px;margin:auto"><h1>✨ PIX Collector</h1><p id="subtitle"></p><div class="bar"><select id="lang" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option></select><button class="secondary" id="importBtn"></button><input type="file" id="file" accept=".json,application/json" hidden></div></div></header>
<main class="wrap"><div class="stats"><div class="stat"><strong id="total">0</strong><span id="totalLabel"></span></div><div class="stat"><strong id="owned">0</strong><span id="ownedLabel"></span></div></div><input id="search" type="search" aria-label="Buscar"><div class="filters"><button data-filter="all" id="allBtn"></button><button data-filter="owned" id="ownedBtn"></button><button data-filter="missing" id="missingBtn"></button></div><div id="grid" class="grid"></div><p class="hint" id="hint"></p></main><footer>PIX Collector · Proyecto independiente de coleccionistas</footer>
<script>
'use strict';
const words={es:{subtitle:'Tu colección de Thrilljoy PIX, organizada.',import:'Importar catálogo',total:'Variantes en catálogo',owned:'En mi colección',search:'Buscar PIX o variante…',all:'Todos',mine:'Los tengo',missing:'Me faltan',add:'Añadir',remove:'✓ Lo tengo',empty:'No hay figuras para mostrar.',hint:'Catálogo preliminar en proceso de verificación. Las fotografías se añadirán cuando estén disponibles.',variants:'variantes',of:'de',catalogError:'No se pudo leer el catálogo. Debe ser un JSON con una lista de figuras.'},en:{subtitle:'Keep your Thrilljoy PIX collection organized.',import:'Import catalog',total:'Variants in catalog',owned:'In my collection',search:'Search PIX or variant…',all:'All',mine:'Owned',missing:'Missing',add:'Add',remove:'✓ Owned',empty:'No figures to display.',hint:'Preliminary catalog being verified. Photos will be added when available.',variants:'variants',of:'of',catalogError:'Could not read catalog. Please select a JSON array of figures.'}};
const $=id=>document.getElementById(id);
const read=(key,fallback)=>{try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x)?x:fallback}catch{return fallback}};
let catalog=read('pix_catalog',[]),owned=read('pix_owned',[]).map(String),filter='all',language=localStorage.getItem('pix_lang')==='en'?'en':'es';
const expanded=new Set();$('lang').value=language;
const valid=data=>Array.isArray(data)&&data.every(x=>x&&x.id!=null&&typeof x.name==='string');
function render(){
 const w=words[language];document.documentElement.lang=language;
 for(const [id,value] of Object.entries({subtitle:w.subtitle,importBtn:w.import,totalLabel:w.total,ownedLabel:w.owned,allBtn:w.all,ownedBtn:w.mine,missingBtn:w.missing,hint:w.hint}))$(id).textContent=value;
 $('search').placeholder=w.search;$('hint').hidden=!catalog.length;$('total').textContent=catalog.length;$('owned').textContent=catalog.filter(x=>owned.includes(String(x.id))).length;
 document.querySelectorAll('[data-filter]').forEach(b=>b.className=b.dataset.filter===filter?'active':'secondary');
 const q=$('search').value.toLocaleLowerCase();const groups=new Map();
 for(const x of catalog){const key=JSON.stringify([String(x.name).trim().toLocaleLowerCase(),String(x.series||'').trim().toLocaleLowerCase()]);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}
 const grid=$('grid');grid.replaceChildren();let count=0;
 for(const [key,all] of groups){const matches=all.filter(x=>[x.name,x.series,x.variant,x.status].join(' ').toLocaleLowerCase().includes(q));const visible=matches.filter(x=>filter==='all'||(filter==='owned')===owned.includes(String(x.id)));if(!visible.length)continue;count++;
 const detail=document.createElement('details');detail.className='group';detail.open=expanded.has(key)||!!q||filter!=='all';detail.addEventListener('toggle',()=>{if(detail.open)expanded.add(key);else expanded.delete(key)});
 const summary=document.createElement('summary');const pic=document.createElement('div');pic.className='thumb';const representative=all.find(x=>x.image&&/^https:\/\//i.test(x.image));if(representative){const img=document.createElement('img');img.src=representative.image;img.alt=representative.name;img.loading='lazy';img.onerror=()=>{pic.textContent='PIX'};pic.append(img)}else pic.textContent='PIX';
 const heading=document.createElement('div');heading.className='group-title';const name=document.createElement('strong');name.textContent=all[0].name;const series=document.createElement('span');series.className='muted';series.textContent=[all[0].series,`${all.filter(x=>owned.includes(String(x.id))).length} ${w.of} ${all.length} ${w.variants}`].filter(Boolean).join(' · ');heading.append(name,series);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';summary.append(pic,heading,arrow);detail.append(summary);
 for(const x of visible){const line=document.createElement('div');line.className='variant';const info=document.createElement('div');info.className='variant-info';const variant=document.createElement('strong');variant.textContent=x.variant||'PIX';const status=document.createElement('span');status.className='muted';status.textContent=x.status||'';info.append(variant,status);const btn=document.createElement('button');const has=owned.includes(String(x.id));btn.className=has?'owned':'secondary';btn.textContent=has?w.remove:w.add;btn.setAttribute('aria-label',`${has?w.remove:w.add}: ${x.name}, ${x.variant||'PIX'}`);btn.onclick=()=>{owned=has?owned.filter(id=>id!==String(x.id)):[...owned,String(x.id)];localStorage.setItem('pix_owned',JSON.stringify(owned));expanded.add(key);render()};line.append(info,btn);detail.append(line)}grid.append(detail)}
 if(!count){const empty=document.createElement('div');empty.className='empty';empty.textContent=w.empty;grid.append(empty)}
}
$('lang').onchange=e=>{language=e.target.value;localStorage.setItem('pix_lang',language);render()};$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!valid(data))throw Error('format');catalog=data;localStorage.setItem('pix_catalog',JSON.stringify(catalog));render()}catch{alert(words[language].catalogError)}e.target.value=''};
render();fetch('./catalogo.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(data=>{if(!valid(data))throw Error('format');catalog=data;localStorage.setItem('pix_catalog',JSON.stringify(catalog));render()}).catch(()=>{});
</script></body></html>
